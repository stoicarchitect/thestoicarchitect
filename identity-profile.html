<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>F5IVE Identity Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow reading column, left aligned, like a printed brief. Dark brand ground with gold as the single accent. */
:root{
  --bg:#12100E; --surface:#1B1815; --surface2:#25211C; --fg:#F1E9DA; --muted:#A79D89; --line:#3A332B;
  --gold:#C9A24B; --gold-ink:#12100E; --bronze:#A8733F;
  --crit:#D0634A; --warn:#D49A3A; --good:#8DB07F;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4EEDF; --surface:#FBF7EC; --surface2:#EBE3D0; --fg:#1C1713; --muted:#675E4F; --line:#D3C8AE;
    --gold:#8A6414; --gold-ink:#FBF7EC; --bronze:#7A4F25;
    --crit:#A63D24; --warn:#9A6710; --good:#3F7A47;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4EEDF; --surface:#FBF7EC; --surface2:#EBE3D0; --fg:#1C1713; --muted:#675E4F; --line:#D3C8AE;
  --gold:#8A6414; --gold-ink:#FBF7EC; --bronze:#7A4F25;
  --crit:#A63D24; --warn:#9A6710; --good:#3F7A47;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-inline:20px;padding-block:0}
.wrap{max-width:720px;margin-inline:auto;padding-block:20px 72px}
.ribbon{font-size:.78rem;letter-spacing:.04em;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.cols{display:flex;gap:3px;align-items:flex-end;height:22px}
.cols i{display:block;width:5px;background:var(--gold);border-radius:1px 1px 0 0}
.cols i:nth-child(1){height:14px}.cols i:nth-child(2){height:18px}.cols i:nth-child(3){height:22px}.cols i:nth-child(4){height:18px}.cols i:nth-child(5){height:14px}
.brand b{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.eyebrow{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 10px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(2.3rem,7vw,3.7rem);font-weight:500;letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,4.6vw,2.2rem);margin-bottom:14px}
h3{font-size:1.35rem;margin-bottom:6px}
p{margin:0 0 14px;max-width:64ch}
.lede{font-size:1.1rem;color:var(--fg);margin-top:18px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.btn{appearance:none;border:1px solid var(--gold);background:var(--gold);color:var(--gold-ink);font:600 .98rem/1 var(--body);padding:15px 22px;border-radius:6px;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.link{background:none;border:0;color:var(--muted);padding:12px 4px;text-decoration:underline}
.btn:focus-visible,.opt:focus-visible,.dot:focus-visible,.val:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:24px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-top:12px;cursor:pointer}
.check input{margin-top:4px;width:20px;height:20px;accent-color:var(--gold);flex:none}
.check span{min-width:0}
.prog{height:3px;background:var(--line);border-radius:2px;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--gold);border-radius:2px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:34px}
.q{font-family:var(--display);font-size:clamp(1.55rem,4.6vw,2.05rem);font-weight:500;line-height:1.2;margin:0 0 26px;max-width:30ch;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font:500 1rem/1.3 var(--body);cursor:pointer;min-height:52px}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.opt.on{border-color:var(--gold);background:var(--surface2)}
.opt.on b{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.stmt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;font-size:1.05rem;line-height:1.4}
.dots{display:flex;justify-content:space-between;gap:6px;margin:14px 0 6px;padding-inline:4px}
.dot{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:0;display:grid;place-items:center;color:var(--muted)}
.dot.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.dot:nth-child(1),.dot:nth-child(5){width:52px;height:52px}
.dotlabels{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-bottom:14px;gap:12px}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.val{position:relative;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:14px 48px 14px 16px;font:500 1rem/1.3 var(--body);cursor:pointer;min-width:0}
.val small{display:block;font-weight:400;color:var(--muted);margin-top:3px;font-size:.84rem;line-height:1.35}
.val em{position:absolute;right:14px;top:14px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.8rem;color:var(--muted)}
.val.on{border-color:var(--gold);background:var(--surface2)}
.val.on em{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.group{margin-top:20px}
.group h3{font-size:1.15rem;font-family:var(--body);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:.84rem;color:var(--muted)}
.field input{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:13px 14px;font:400 1rem var(--body);min-height:48px;width:100%}
details.tools{margin-top:56px;border-top:1px solid var(--line);padding-top:14px}
details.tools summary{cursor:pointer;color:var(--muted);font-size:.84rem;letter-spacing:.06em;text-transform:uppercase}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toolrow .btn{padding:11px 14px;min-height:42px;font-size:.88rem}
pre.out{white-space:pre-wrap;font:.8rem/1.5 ui-monospace,Menlo,monospace;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:12px;overflow-x:auto}
/* report */
.hero{border:1px solid var(--gold);border-radius:10px;padding:30px 22px;background:var(--surface);position:relative}
.hero h1{margin:6px 0 12px}
.sig{font-family:var(--display);font-style:italic;font-size:1.4rem;line-height:1.3;max-width:34ch;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.82rem;color:var(--fg)}
.chip b{color:var(--gold);font-weight:600;margin-right:4px}
.sec{margin-top:56px}
.sec>.eyebrow{margin-bottom:6px}
.bars{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.bar{display:grid;grid-template-columns:84px 1fr auto;gap:12px;align-items:center}
.bar .track{height:12px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .lbl{font-weight:600}
.bar .val2{font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--muted);white-space:nowrap}
.b-crit{background:var(--crit)}.b-warn{background:var(--warn)}.b-solid{background:var(--gold)}.b-strong{background:var(--good)}
.radar{width:100%;max-width:340px;height:auto;display:block;margin:6px 0 4px}
.radar .g{fill:none;stroke:var(--line);stroke-width:1}
.radar .ax{stroke:var(--line);stroke-width:1}
.radar .poly{fill:var(--gold);fill-opacity:.22;stroke:var(--gold);stroke-width:2}
.radar text{fill:var(--fg);font:600 12px var(--body)}
.radar .dotp{fill:var(--gold)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.panel{border:1px solid var(--line);border-radius:8px;padding:18px;background:var(--surface);min-width:0}
.panel p:last-child{margin-bottom:0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;margin:0}
.kv dt{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0}
.rule{border-left:3px solid var(--gold);padding:4px 0 4px 14px;margin:18px 0}
.days{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column}
.days li{display:grid;grid-template-columns:34px 1fr;gap:4px 14px;padding:14px 0;border-top:1px solid var(--line)}
.days li:last-child{border-bottom:1px solid var(--line)}
.days .n{font-family:var(--display);font-size:1.7rem;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.days .t{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.days .d{grid-column:2}
.prompts{margin:0;padding-left:20px}
.prompts li{margin-bottom:12px;max-width:60ch}
.cardimg{max-width:340px;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;display:block;margin-top:14px}
.notice{border:1px dashed var(--line);border-radius:8px;padding:14px 16px;font-size:.88rem;color:var(--muted);margin-top:18px}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--bronze);color:var(--bronze);border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:middle}
a{color:var(--gold)}
@media (max-width:480px){.bar{grid-template-columns:70px 1fr}.bar .val2{grid-column:1 / -1;margin-top:-8px}.kv{grid-template-columns:1fr}.kv dt{padding-top:8px}}
@media (prefers-reduced-motion:no-preference){.hero{animation:rise .5s ease both}@keyframes rise{from{transform:translateY(8px)}to{transform:none}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ============ Scoring engine (identical to the tested reference file) ============ */
var PILLARS = ["Faith", "Family", "Finance", "Fitness", "Freedom"];
var VALUE_PILLAR = {
  "Purpose and meaning": "Faith", "Integrity and conscience": "Faith",
  "Loyalty and belonging": "Family", "Legacy": "Family",
  "Security": "Finance", "Building wealth": "Finance",
  "Discipline": "Fitness", "Strength and health": "Fitness",
  "Independence": "Freedom", "Ownership of my time": "Freedom"
};
var ARCHETYPES = {
  Faith: { Strategist: "The Compass", Visionary: "The Lighthouse", Builder: "The Cornerstone", Operator: "The Sentinel" },
  Family: { Strategist: "The Steward", Visionary: "The Harbour", Builder: "The Provider", Operator: "The Protector" },
  Finance: { Strategist: "The Treasurer", Visionary: "The Venturer", Builder: "The Vault Builder", Operator: "The Dealmaker" },
  Fitness: { Strategist: "The Periodiser", Visionary: "The Phoenix", Builder: "The Forge", Operator: "The Warrior" },
  Freedom: { Strategist: "The Cartographer", Visionary: "The Horizon Chaser", Builder: "The Independent", Operator: "The Free Agent" }
};
function pillarBand(score) { if (score <= 10) return "Critical gap"; if (score <= 15) return "Underbuilt"; if (score <= 20) return "Solid"; return "Strong"; }
function imbalanceBand(gap) { if (gap <= 3) return "Balanced"; if (gap <= 8) return "Leaning"; if (gap <= 13) return "Lopsided"; return "Critical"; }
function strength(sum) { var a = Math.abs(sum); if (a === 0) return "Blended"; if (a <= 2) return "Slight"; if (a <= 4) return "Moderate"; return "Strong"; }
function axisResult(items) {
  var sum = items[0] + items[1] + items[2]; var pole;
  if (sum !== 0) pole = sum > 0 ? "A" : "B";
  else if (items[2] !== 0) pole = items[2] > 0 ? "A" : "B";
  else { var first = items.find(function (v) { return v !== 0; }); pole = first === undefined ? "A" : (first > 0 ? "A" : "B"); }
  return { sum: sum, pole: pole, strength: strength(sum) };
}
function rankOf(scores, pillar) { return 1 + PILLARS.filter(function (p) { return scores[p] > scores[pillar]; }).length; }
function scoreProfile(input) {
  var scores = {};
  PILLARS.forEach(function (p) { scores[p] = input.quick[p] + input.extra[p][0] + input.extra[p][1]; });
  var high = Math.max.apply(null, PILLARS.map(function (p) { return scores[p]; }));
  var low = Math.min.apply(null, PILLARS.map(function (p) { return scores[p]; }));
  var imbalance = high - low;
  var grav = {}; PILLARS.forEach(function (p) { grav[p] = 0; });
  [3, 2, 1].forEach(function (w, i) { grav[VALUE_PILLAR[input.values.ranked[i]]] += w; });
  grav[input.values.protect] += 3;
  var maxGrav = Math.max.apply(null, PILLARS.map(function (p) { return grav[p]; }));
  var gravTied = PILLARS.filter(function (p) { return grav[p] === maxGrav; });
  var rank1Pillar = VALUE_PILLAR[input.values.ranked[0]];
  var gravity;
  if (gravTied.length === 1) gravity = gravTied[0];
  else if (gravTied.indexOf(input.values.protect) >= 0) gravity = input.values.protect;
  else if (gravTied.indexOf(rank1Pillar) >= 0) gravity = rank1Pillar;
  else gravity = gravTied[0];
  var weakCandidates = PILLARS.filter(function (p) { return scores[p] === low; });
  weakCandidates.sort(function (a, b) { return grav[b] - grav[a] || PILLARS.indexOf(a) - PILLARS.indexOf(b); });
  var weakest = weakCandidates[0];
  var ordered = PILLARS.slice().sort(function (a, b) { return scores[b] - scores[a] || grav[b] - grav[a] || PILLARS.indexOf(a) - PILLARS.indexOf(b); });
  var anchor = ordered[0]; var shadow = null;
  if (scores[ordered[0]] - scores[ordered[1]] <= 1) shadow = ordered[1];
  var sp = axisResult(input.style.slice(0, 3)), rh = axisResult(input.style.slice(3, 6)), dr = axisResult(input.style.slice(6, 9)), su = axisResult(input.style.slice(9, 12));
  var mode = sp.pole === "A" ? (rh.pole === "A" ? "Strategist" : "Visionary") : (rh.pole === "A" ? "Builder" : "Operator");
  var complete = imbalance <= 3;
  var archetype = complete ? "The Complete Architect" : ARCHETYPES[anchor][mode];
  var gRank = rankOf(scores, gravity); var alignment = "Aligned";
  if (scores[ordered[0]] - scores[gravity] >= 3) alignment = gRank <= 2 ? "Aligned" : (gRank === 3 ? "Drifting" : "Misaligned");
  return {
    scores: scores,
    bands: PILLARS.reduce(function (o, p) { o[p] = pillarBand(scores[p]); return o; }, {}),
    anchor: anchor, shadow: shadow, weakest: weakest, imbalance: imbalance, imbalanceBand: imbalanceBand(imbalance),
    mode: mode, drive: dr.pole === "A" ? "Inner" : "Outer", driveStrength: dr.strength,
    support: su.pole === "A" ? "Solo" : "Shared", supportStrength: su.strength,
    gravity: gravity, sacrificed: input.values.slip, sacrificedIsWeakest: input.values.slip === weakest,
    alignment: alignment, archetype: archetype,
    axisSums: { starting: sp.sum, rhythm: rh.sum, drive: dr.sum, support: su.sum }
  };
}

/* ============ Questions ============ */
var QUICK = [
  { p: "Faith", t: "When external pressures mount, work stress, financial strain, relationship conflict, you have a clear sense of who you are that remains stable." },
  { p: "Faith", t: "You can articulate the core values that guide your decisions, and your actions under pressure reflect those values consistently." },
  { p: "Faith", t: "Your sense of purpose is not tied exclusively to your professional role, it would survive a redundancy, a career change, or the loss of a title." },
  { p: "Family", t: "When you are physically present with the people closest to you, you are genuinely mentally present, not distracted by work, tasks, or your phone." },
  { p: "Family", t: "The people closest to you would describe you as emotionally available and genuinely interested in what is happening in their lives." },
  { p: "Family", t: "Your most important relationships are improving, not just surviving, because of the deliberate investment you make in them." },
  { p: "Finance", t: "You have a clear picture of your net financial position, what you own, what you owe, and what you are actively building." },
  { p: "Finance", t: "Your financial systems operate automatically, savings transfer on payday, investments are not dependent on monthly willpower." },
  { p: "Finance", t: "Financial stress is not a persistent background noise in your life, money is managed structurally rather than reactively." },
  { p: "Fitness", t: "Your training or physical practice is consistent regardless of how you feel, it operates as a system rather than depending on motivation." },
  { p: "Fitness", t: "When you miss a session or fall off track, you return within 48 hours, consistency is recovered quickly rather than abandoned entirely." },
  { p: "Fitness", t: "Your physical standards are a genuine reflection of your internal standards, your body is evidence of your commitment." },
  { p: "Freedom", t: "Your days have a deliberate structure that protects what matters, you direct your time rather than reacting to whatever is most urgent." },
  { p: "Freedom", t: "You regularly experience a sense of alignment, that who you are, what you do, and what you value are pointing in the same direction." },
  { p: "Freedom", t: "The overall architecture of your life, across all five areas, feels intentional rather than something that is simply happening to you." }
];
var EXTRA = [
  { id: "FTH-1", p: "Faith", t: "In the last 30 days, I made time for prayer, reflection or stillness without anyone prompting me.", lens: "In the last 30 days, I kept my five daily prayers on time on most days." },
  { id: "FAM-1", p: "Family", t: "In the last 30 days, when there was tension with someone close to me, I raised it and repaired it instead of letting it sit." },
  { id: "FIN-1", p: "Finance", t: "In the last 30 days, I gave from my money to people or causes I believe in." },
  { id: "FIT-1", p: "Fitness", t: "I fuel my body on purpose most days instead of eating on autopilot." },
  { id: "FRD-1", p: "Freedom", t: "I have defined what freedom means for me in concrete terms, such as an income, a date or a set of conditions, and I can state it." },
  { id: "FTH-2", p: "Faith", t: "I have a trusted source of guidance, such as scripture, a teacher, a mentor or a community, and I turn to it when things are unclear." },
  { id: "FAM-2", p: "Family", t: "In the last 30 days, I started meaningful conversations with people close to me instead of waiting for them to raise things." },
  { id: "FIN-2", p: "Finance", t: "In the last 90 days, I took a concrete step to grow my income or assets, such as a new skill, income stream or asset." },
  { id: "FIT-2", p: "Fitness", t: "In the last 30 days, I kept a steady sleep routine and got enough rest on most nights." },
  { id: "FRD-2", p: "Freedom", t: "In the last 30 days, I said no to a request or commitment that did not fit where I am heading." }
];
var EXTRA_IDS = { Faith: ["FTH-1", "FTH-2"], Family: ["FAM-1", "FAM-2"], Finance: ["FIN-1", "FIN-2"], Fitness: ["FIT-1", "FIT-2"], Freedom: ["FRD-1", "FRD-2"] };
var STYLE = [
  { id: "STY-1", a: "I start a big goal by picturing the finished result in detail.", b: "I start a big goal by doing the first small thing and learning as I go." },
  { id: "STY-2", a: "I would rather spend a week getting the plan right.", b: "I would rather put something rough out this week and improve it." },
  { id: "STY-3", a: "People would say I see where things are heading before others do.", b: "People would say I get things moving while others are still talking." },
  { id: "STY-4", a: "I do my best work with fixed routines and set times.", b: "I do my best work when I choose what to do based on how the day is going." },
  { id: "STY-5", a: "A plan that changes midweek feels like a setback.", b: "A plan that cannot change midweek is a bad plan." },
  { id: "STY-6", a: "I track my habits and review them on a schedule.", b: "I keep my habits loose and adjust them by feel." },
  { id: "STY-7", a: "I know I did well when I met my own standard, whatever others thought.", b: "I know I did well when others noticed and recognised it." },
  { id: "STY-8", a: "I would keep working on a goal even if no one ever knew.", b: "Having people see my progress is what keeps me going." },
  { id: "STY-9", a: "I measure myself against who I was last year.", b: "I measure myself against the people around me." },
  { id: "STY-10", a: "When I struggle, I work it out by myself first.", b: "When I struggle, I talk it through with someone quickly." },
  { id: "STY-11", a: "I prefer a private plan to having an accountability partner.", b: "I commit harder when someone is holding me to it." },
  { id: "STY-12", a: "I prefer to solve my own problems before involving anyone.", b: "I prefer to involve someone early so I do not lose time." }
];
var VALUES = [
  { v: "Purpose and meaning", line: "Living for something bigger than comfort" },
  { v: "Integrity and conscience", line: "Doing right when it costs me" },
  { v: "Loyalty and belonging", line: "Being someone my people can rely on" },
  { v: "Legacy", line: "What I leave behind for those who come after me" },
  { v: "Security", line: "Knowing my household is safe whatever happens" },
  { v: "Building wealth", line: "Growing what I own over time" },
  { v: "Discipline", line: "Doing it when I do not feel like it" },
  { v: "Strength and health", line: "A body that can carry my responsibilities" },
  { v: "Independence", line: "Answering to no one for my choices" },
  { v: "Ownership of my time", line: "Deciding how my days are spent" }
];
var HARD = [

    x.fillText(line, 100, y);
    var by = 700;
    PILLARS.forEach(function (p, i) {
      var yy = by + i * 74;
      x.fillStyle = "#A79D89"; x.font = "600 28px " + sans; x.fillText(p, 100, yy + 24);
      x.fillStyle = "#25211C"; x.fillRect(300, yy, 560, 30);
      x.fillStyle = "#C9A24B"; x.fillRect(300, yy, 560 * r.scores[p] / 25, 30);
      x.fillStyle = "#F1E9DA"; x.font = "600 28px " + sans; x.fillText(String(r.scores[p]), 890, yy + 26);
    });
    x.fillStyle = "#A79D89"; x.font = "500 30px " + sans;
    x.fillText(r.mode + "  /  " + r.drive + "  /  " + r.support, 100, 1150);
    x.fillStyle = "#C9A24B"; x.font = "600 28px " + sans; x.fillText("Find your archetype", 100, 1230);
    x.fillStyle = "#A79D89"; x.font = "500 26px " + sans; x.fillText("https://www.thestoicarchitect.com/quiz.html", 100, 1270);
    var img = document.getElementById("cardimg"); if (img) img.src = c.toDataURL("image/png");
  } catch (e) { /* card is optional */ }
}

/* ============ Screens ============ */
var app = document.getElementById("app");
function head(part, n, total) {
  return '<div class="brand"><span class="cols"><i></i><i></i><i></i><i></i><i></i></span><b>The Stoic Architect</b></div>' +
    '<div class="prog"><i style="width:' + Math.round(n / total * 100) + '%"></i></div><div class="meta"><span>' + PARTS[part] + "</span><span>" + n + " of " + total + "</span></div>";
}
function tools() {
  return '<details class="tools"><summary>Prototype tools</summary><div class="toolrow">' +
    '<button class="btn ghost" data-act="sample" data-n="0">Load sample 1</button><button class="btn ghost" data-act="sample" data-n="1">Load sample 2</button><button class="btn ghost" data-act="sample" data-n="2">Load sample 3</button>' +
    '<button class="btn ghost" data-act="fill">Fill the rest randomly</button><button class="btn ghost" data-act="tests">Run engine tests</button><button class="btn ghost" data-act="restart">Restart</button></div><pre class="out" id="out" hidden></pre></details>';
}
function render() {
  var S = steps(), st = S[state.i], qs = S.filter(function (s) { return s.part; });
  var html = "";
  var ribbon = '<div class="ribbon">Prototype build. Nothing you enter here is sent, saved or stored.</div>';
  if (st.t === "intro") {
    html = ribbon + '<div class="brand"><span class="cols"><i></i><i></i><i></i><i></i><i></i></span><b>The Stoic Architect</b></div>' +
      '<p class="eyebrow">The F5IVE Identity Profile</p><h1>One pillar is carrying you. Another is quietly costing you.</h1>' +
      '<p class="lede">Faith, Family, Finance, Fitness, Freedom. Answer 39 questions and get a named archetype, a map of where you stand, and a seven day plan for your weakest pillar.</p>' +
      '<p class="muted">About 8 minutes. No email until your result is ready.</p>' +
      '<div class="notice" style="margin-top:22px">This is a self-reflection tool built on the F5IVE framework. It is not a clinical or psychological test and it does not diagnose anything. Use it to start a better conversation with yourself.</div>' +
      '<label class="check"><input type="checkbox" id="age"' + (state.age ? " checked" : "") + '><span>I am 18 or over.</span></label>' +
      '<div class="row"><button class="btn" data-act="next" id="go"' + (state.age ? "" : " disabled") + ">Start the profile</button></div>" + tools();
  } else if (st.t === "likert") {
    var n = qs.indexOf(st) + 1, cur = state.ans[st.id];
    html = ribbon + head(st.part, n, qs.length) + '<p class="q">' + st.text + '</p><div class="opts">' +
      SCALE.map(function (l, k) { return '<button class="opt' + (cur === k + 1 ? " on" : "") + '" data-act="ans" data-v="' + (k + 1) + '"><b>' + (k + 1) + "</b>" + l + "</button>"; }).join("") +
      '</div><div class="row"><button class="btn link" data-act="back">Back</button></div>' + tools();
  } else if (st.t === "consent") {
    html = ribbon + '<div class="brand"><span class="cols"><i></i><i></i><i></i><i></i><i></i></span><b>The Stoic Architect</b></div>' +
      '<p class="eyebrow">Before the next part</p><h2>A note on faith questions</h2>' +
      '<p>The next questions ask about faith, purpose and conscience. Your answers can reveal religious belief, which is sensitive information. You can say no and still get a full result.</p>' +
      '<label class="check"><input type="checkbox" id="faith"' + (state.faith === true ? " checked" : "") + '><span>Some questions ask about faith, purpose and conscience. Your answers can reveal religious belief, which is sensitive information. I agree to The Stoic Architect using my answers to calculate my profile and results. I can withdraw this at any time.</span></label>' +
      '<label class="check"><input type="checkbox" id="lens"' + (state.lens ? " checked" : "") + (state.faith === true ? "" : " disabled") + '><span>Add an Islamic perspective to my report. This is optional and I can leave it unticked.</span></label>' +
      '<div class="row"><button class="btn" data-act="consent-next">Continue</button><button class="btn link" data-act="back">Back</button></div>' +
      '<p class="small muted" style="margin-top:14px">If you leave the first box unticked, the Faith questions are skipped and your Faith score comes from your Part 1 answers only.</p>' + tools();
  } else if (st.t === "style") {
    var n2 = qs.indexOf(st) + 1, cur2 = state.ans[st.id], fl = state.flips[st.id];
    var first = fl ? st.b : st.a, second = fl ? st.a : st.b;
    var vals = [2, 1, 0, -1, -2];
    html = ribbon + head(3, n2, qs.length) + '<p class="q" style="font-size:1.3rem;margin-bottom:18px">Which sounds more like you?</p>' +
      '<div class="stmt">' + first + '</div><div class="dots" role="group" aria-label="Choose where you sit between the two statements">' +
      vals.map(function (v, k) { return '<button class="dot' + (cur2 === v ? " on" : "") + '" data-act="ans" data-v="' + v + '" aria-label="' + ["Much more like the first", "A little more like the first", "In the middle", "A little more like the second", "Much more like the second"][k] + '">' + (k === 2 ? "=" : "") + "</button>"; }).join("") +
      '</div><div class="dotlabels"><span>Much more like the first</span><span>Much more like the second</span></div><div class="stmt">' + second + '</div>' +
      '<div class="row"><button class="btn link" data-act="back">Back</button></div>' + tools();
  } else if (st.t === "rank") {
    var pool = state.order.filter(function (v) { return !(state.faith === false && VALUE_PILLAR[v] === "Faith"); });
    var line = {}; VALUES.forEach(function (v) { line[v.v] = v.line; });
    html = ribbon + head(4, qs.indexOf(S.filter(function (s) { return s.t === "rank"; })[0]) + 1, qs.length) +
      '<p class="q" style="font-size:1.5rem;margin-bottom:8px">Choose the three values you would defend hardest, then put them in order.</p><p class="muted small">Tap in order: first tap is your top value. Tap again to remove one.</p><div class="vals">' +
      pool.map(function (v) { var k = state.rank.indexOf(v); return '<button class="val' + (k >= 0 ? " on" : "") + '" data-act="rank" data-v="' + v + '">' + v + "<small>" + line[v] + "</small><em>" + (k >= 0 ? k + 1 : "") + "</em></button>"; }).join("") +
      '</div><div class="row"><button class="btn" data-act="next"' + (state.rank.length === 3 ? "" : " disabled") + '>Continue</button><button class="btn link" data-act="back">Back</button></div>' + tools();
  } else if (st.t === "choice") {
    var hp = state.hardOrder.filter(function (p) { return !(state.faith === false && p === "Faith"); });
    var txt = {}; HARD.forEach(function (h2) { txt[h2.p] = h2.t; });
    var grp = function (key, title, excl) {
      return '<div class="group"><h3>' + title + '</h3><div class="opts" style="margin-top:10px">' + hp.filter(function (p) { return p !== excl; }).map(function (p) { return '<button class="opt' + (state[key] === p ? " on" : "") + '" data-act="pick" data-key="' + key + '" data-v="' + p + '"><b></b>' + txt[p] + "</button>"; }).join("") + "</div></div>";
    };
    html = ribbon + head(4, qs.length, qs.length) + '<p class="q" style="font-size:1.45rem;margin-bottom:6px">It is a hard season. You have limited time, money and energy, and you can fully protect only one area of life.</p>' +
      grp("protect", "Which do you protect?", null) + (state.protect ? grp("slip", "Which do you let slip?", state.protect) : "") +
      '<div class="row"><button class="btn" data-act="next"' + (state.protect && state.slip ? "" : " disabled") + '>Continue</button><button class="btn link" data-act="back">Back</button></div>' + tools();
  } else if (st.t === "email") {
    html = ribbon + '<div class="brand"><span class="cols"><i></i><i></i><i></i><i></i><i></i></span><b>The Stoic Architect</b></div>' +
      '<p class="eyebrow">Your result is ready</p><h2>Where should we send it?</h2><p>In the live version, your report arrives by email and you join the F5IVE Journey. In this prototype nothing is sent, so you can leave these blank.</p>' +
      '<div class="field"><label for="fn">First name</label><input id="fn" autocomplete="given-name"></div><div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>' +
      '<label class="check"><input type="checkbox" id="opt"><span>Send my results and report to this address, and add me to the F5IVE Journey emails. I can unsubscribe at any time.</span></label>' +
      '<div class="row"><button class="btn" data-act="next">See my result</button><button class="btn link" data-act="back">Back</button></div>' + tools();
  } else {
    var r = scoreProfile(buildInput());
    html = ribbon + '<div class="brand"><span class="cols"><i></i><i></i><i></i><i></i><i></i></span><b>The Stoic Architect</b></div>' + reportHTML(r) +
      '<div class="row"><button class="btn ghost" data-act="restart">Start again</button></div>' + tools();
    app.innerHTML = html; drawCard(r); window.scrollTo(0, 0); return;
  }
  app.innerHTML = html; window.scrollTo(0, 0);
}

/* ============ Actions ============ */
function next() { state.i = Math.min(state.i + 1, steps().length - 1); render(); }
function back() { state.i = Math.max(state.i - 1, 0); render(); }
function fillRandom() {
  var r = function (a, b) { return a + Math.floor(Math.random() * (b - a + 1)); };
  QUICK.forEach(function (q, k) { if (state.ans["Q" + (k + 1)] === undefined) state.ans["Q" + (k + 1)] = r(2, 5); });
  if (state.faith === null) state.faith = true;
  EXTRA.forEach(function (e) { if (state.ans[e.id] === undefined) state.ans[e.id] = r(2, 5); });
  STYLE.forEach(function (s) { if (state.ans[s.id] === undefined) state.ans[s.id] = r(-2, 2); });
  var pool = state.order.filter(function (v) { return !(state.faith === false && VALUE_PILLAR[v] === "Faith"); });
  while (state.rank.length < 3) { var c = pool[r(0, pool.length - 1)]; if (state.rank.indexOf(c) < 0) state.rank.push(c); }
  var ps = PILLARS.filter(function (p) { return !(state.faith === false && p === "Faith"); });
  if (!state.protect) state.protect = ps[r(0, ps.length - 1)];
  if (!state.slip) { var o = ps.filter(function (p) { return p !== state.protect; }); state.slip = o[r(0, o.length - 1)]; }
  state.i = steps().findIndex(function (s) { return s.t === "email"; }); render();
}
var SAMPLES = [
  { quick: { Faith: 12, Family: 9, Finance: 6, Fitness: 11, Freedom: 9 }, extra: { Faith: [4, 4], Family: [3, 2], Finance: [3, 2], Fitness: [3, 3], Freedom: [3, 3] }, style: [2, 1, 1, -1, -1, -1, 2, 2, 1, -1, -1, 0], values: { ranked: ["Legacy", "Loyalty and belonging", "Purpose and meaning"], protect: "Family", slip: "Finance" } },
  { quick: { Faith: 11, Family: 8, Finance: 9, Fitness: 7, Freedom: 11 }, extra: { Faith: [3, 4], Family: [3, 4], Finance: [3, 4], Fitness: [3, 4], Freedom: [3, 4] }, style: [-2, -2, -1, 1, 2, 1, 0, 0, 0, 1, 1, -1], values: { ranked: ["Independence", "Ownership of my time", "Integrity and conscience"], protect: "Freedom", slip: "Family" } },
  { quick: { Faith: 10, Family: 9, Finance: 11, Fitness: 10, Freedom: 9 }, extra: { Faith: [3, 4], Family: [3, 4], Finance: [3, 4], Fitness: [3, 4], Freedom: [3, 4] }, style: [1, 1, 1, 2, 1, 0, 0, 0, 0, 0, 0, 0], values: { ranked: ["Ownership of my time", "Legacy", "Purpose and meaning"], protect: "Family", slip: "Fitness" } }
];
var EXPECT = [
  { scores: { Faith: 20, Family: 14, Finance: 11, Fitness: 17, Freedom: 15 }, anchor: "Faith", shadow: null, weakest: "Finance", imbalance: 9, mode: "Visionary", archetype: "The Lighthouse", drive: "Inner", support: "Shared", gravity: "Family", alignment: "Misaligned", sacrificedIsWeakest: true },
  { scores: { Faith: 18, Family: 15, Finance: 16, Fitness: 14, Freedom: 18 }, anchor: "Freedom", shadow: "Faith", weakest: "Fitness", imbalance: 4, mode: "Builder", archetype: "The Independent", drive: "Inner", support: "Solo", gravity: "Freedom", alignment: "Aligned", sacrificedIsWeakest: false },
  { scores: { Faith: 17, Family: 16, Finance: 18, Fitness: 17, Freedom: 16 }, anchor: "Finance", shadow: "Faith", weakest: "Family", imbalance: 2, mode: "Strategist", archetype: "The Complete Architect", drive: "Inner", support: "Solo", gravity: "Family", alignment: "Aligned", sacrificedIsWeakest: false }
];
function runTests() {
  var out = [], ok = 0;
  SAMPLES.forEach(function (s, k) {
    var r = scoreProfile(s), e = EXPECT[k], bad = [];
    Object.keys(e).forEach(function (key) { if (JSON.stringify(r[key]) !== JSON.stringify(e[key])) bad.push(key + " got " + JSON.stringify(r[key]) + " expected " + JSON.stringify(e[key])); });
    if (!bad.length) ok++;
    out.push("Case " + (k + 1) + ": " + (bad.length ? "FAIL " + bad.join("; ") : "pass"));
  });
  out.push(ok + " of " + SAMPLES.length + " cases pass");
  return out.join("\n");
}

document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]"); if (!b) return;
  var a = b.getAttribute("data-act"), S = steps(), st = S[state.i];
  if (a === "next") next();
  else if (a === "back") back();
  else if (a === "ans") { state.ans[st.id] = Number(b.getAttribute("data-v")); render(); setTimeout(next, 220); }
  else if (a === "rank") {
    var v = b.getAttribute("data-v"), k = state.rank.indexOf(v);
    if (k >= 0) state.rank.splice(k, 1); else if (state.rank.length < 3) state.rank.push(v);
    render();
  } else if (a === "pick") {
    var key = b.getAttribute("data-key"); state[key] = b.getAttribute("data-v");
    if (key === "protect" && state.slip === state.protect) state.slip = null;
    render();
  } else if (a === "consent-next") {
    var f = document.getElementById("faith"), l = document.getElementById("lens");
    state.faith = !!(f && f.checked); state.lens = state.faith && !!(l && l.checked);
    if (state.faith === false) { state.rank = state.rank.filter(function (v) { return VALUE_PILLAR[v] !== "Faith"; }); if (state.protect === "Faith") state.protect = null; if (state.slip === "Faith") state.slip = null; }
    next();
  } else if (a === "sample") { state.override = SAMPLES[Number(b.getAttribute("data-n"))]; state.faith = true; state.i = steps().length - 1; render(); }
  else if (a === "fill") fillRandom();
  else if (a === "tests") { var o = document.getElementById("out"); o.hidden = false; o.textContent = runTests(); }
  else if (a === "restart") { state.i = 0; state.ans = {}; state.age = false; state.faith = null; state.lens = false; state.rank = []; state.protect = null; state.slip = null; state.override = null; render(); }
});
document.addEventListener("change", function (ev) {
  if (ev.target.id === "age") { state.age = ev.target.checked; var g = document.getElementById("go"); if (g) g.disabled = !state.age; }
  if (ev.target.id === "faith") { var l = document.getElementById("lens"); if (l) { l.disabled = !ev.target.checked; if (!ev.target.checked) l.checked = false; } }
});
render();
</script>
